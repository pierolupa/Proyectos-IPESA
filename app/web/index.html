  <style>
    /* Pantalla de carga: logo IPESA, "CARGANDO DATOS" y una ruedita que
       gira. Es la ÚNICA pantalla de carga de la página (la de Flutter, en
       web, queda en negro debajo). En el celular, la app instalada muestra
       antes su propia pantalla de inicio (fondo negro y el ícono de RPA al
       centro, ver manifest.json): por eso el logo de RPA va tenue al
       centro, IPESA encima, y el texto y la ruedita cuelgan debajo sin
       moverlos; así se ve como una sola pantalla. Se pinta al instante
       (logo incrustado) y se queda hasta que la app ya dibujó la pantalla
       siguiente; recién ahí la app la desvanece (quitarSplashHtml en
       lib/services/splash_html). La ruedita gira con transform, que el
       navegador anima aparte: sigue fluida aunque la app esté cargando. */
    html, body { margin: 0; height: 100%; background: #000; }
    #inicio {
      position: fixed; inset: 0; z-index: 10;
      background: #000; color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .35s ease;
    }
    /* Detrás de IPESA, el logo de RPA tenue (sin fondo): así
       continúa la pantalla del celular (que muestra el ícono de RPA) y
       se funde con la de carga. */
    #inicio .marca {
      position: absolute; left: 50%; top: 50%;
      width: min(300px, 74vw); height: min(300px, 74vw);
      transform: translate(-50%, -50%);
      opacity: .4;
    }
    #inicio .ipesa {
      position: absolute; left: 50%; top: 50%;
      width: 170px; height: auto; transform: translate(-50%, -50%);
    }
    #inicio .debajo {
      position: absolute; left: 0; right: 0; top: calc(50% + 48px);
      display: flex; flex-direction: column; align-items: center;
    }
    #inicio p {
      margin: 0 0 26px; font-size: 14px; font-weight: 600;
      letter-spacing: 2.4px; color: #fff;
    }
    #inicio .rueda {
      box-sizing: border-box; width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, .22);
      border-top-color: #fff;
      animation: girar .85s linear infinite;
      will-change: transform;
    }
    #inicio.fuera { opacity: 0; pointer-events: none; }
    @keyframes girar { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #inicio .rueda { animation-duration: 2.5s; }
    }
  </style>
</head>
